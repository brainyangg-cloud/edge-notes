<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'">
<title>查看图片</title>
<link rel="stylesheet" href="common.css">
<style>
html, body { height: 100%; overflow: hidden; background: #111; color: #fff; color-scheme: dark; }
header { position: absolute; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 16px; background: rgba(0,0,0,.45); z-index: 2; }
header .t { font-weight: 600; } header .s { font-size: 12px; color: #aaa; margin-left: 10px; }
.tb { height: 34px; padding: 0 12px; border: none; border-radius: 4px; background: transparent; color: #fff; font-size: 13px; }
.tb:hover { background: rgba(255,255,255,.12); }
#stage { position: absolute; inset: 0; overflow: hidden; cursor: grab; }
#stage.drag { cursor: grabbing; }
#img { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.nav { position: absolute; top: 50%; margin-top: -24px; width: 48px; height: 48px; border-radius: 24px; border: none; background: rgba(255,255,255,.14); color: #fff; font-size: 22px; z-index: 2; }
.nav:hover { background: rgba(255,255,255,.25); }
#prev { left: 20px; } #next { right: 20px; }
#strip { position: absolute; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; gap: 10px; z-index: 2; }
#strip img { width: 72px; height: 52px; object-fit: cover; border-radius: 4px; opacity: .6; cursor: pointer; }
#strip img.on { opacity: 1; box-shadow: 0 0 0 3px #fff; }
#msg { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); padding: 6px 14px; border-radius: 6px; background: rgba(255,255,255,.15); font-size: 13px; display: none; z-index: 3; }
</style>
</head>
<body>
<header>
  <span class="t" id="title"></span><span class="s" id="info"></span>
  <span style="flex:1"></span>
  <button class="tb" id="zout" aria-label="缩小">－</button><span id="zv" style="width:52px;text-align:center;font-size:13px">100%</span><button class="tb" id="zin" aria-label="放大">＋</button>
  <button class="tb" id="fit">适应窗口</button><button class="tb" id="one">原始大小</button>
  <span style="width:1px;height:20px;background:rgba(255,255,255,.25);margin:0 6px"></span>
  <button class="tb" id="copy">复制图片</button><button class="tb" id="save">另存为…</button>
  <button class="tb" id="close" aria-label="关闭" style="font-size:16px">✕</button>
</header>
<div id="stage"><img id="img" alt="" draggable="false"></div>
<button class="nav" id="prev" aria-label="上一张">‹</button><button class="nav" id="next" aria-label="下一张">›</button>
<div id="strip"></div>
<div id="msg"></div>
<script src="common.js"></script>
<script src="viewer.js"></script>
</body>
</html>

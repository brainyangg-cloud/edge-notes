<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'">
<title>边缘便签</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="edge.css">
</head>
<body class="st-rest">
  <div id="strip" class="hit" role="button" aria-label="便签，鼠标移入展开"></div>
  <div id="deck"></div>
  <button id="addBtn" class="hit" aria-label="新建便签" title="新建便签 (Ctrl+Alt+N)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <div id="preview"></div>

  <section id="panel" class="hit" aria-label="便签">
    <div id="gutter" title="收起 (Esc)"><span class="lbl"></span></div>
    <div id="body">
      <div id="head">
        <input id="title" aria-label="标题" placeholder="标题" maxlength="80">
        <button class="ib" id="bTask" title="清单 (Ctrl+T)" aria-label="清单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l2 2 3-3M4 14l2 2 3-3M13 7h7M13 15h7"/></svg></button>
        <button class="ib" id="bImg" title="插入图片（也可以 Ctrl+V 粘贴）" aria-label="插入图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></button>
        <button class="ib" id="bAlarm" title="设置提醒" aria-label="设置提醒"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 2M5 4l3 2M19 4l-3 2"/></svg></button>
        <button class="ib" id="bPin" title="钉住：一直显示 (Ctrl+P)" aria-label="钉住"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 4 3H6l4-3z"/><path d="M12 13v7"/></svg></button>
        <button class="ib" id="bMore" title="更多" aria-label="更多"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
      </div>
      <div id="dueBar"><span class="grow"></span><button id="dueSnooze">10 分钟后</button><button id="dueDone" class="primary">完成</button></div>
      <div id="chipRow"></div>
      <div id="editor" contenteditable="true" spellcheck="false" data-placeholder="写点什么…  Ctrl+V 可直接粘贴截图"></div>
      <div id="foot"><span>Ctrl+V 贴图</span><span>Ctrl+T 清单</span><span>Ctrl+. 换颜色</span><span>Esc 收起</span><span id="saved"></span></div>
    </div>
    <div class="pop" id="alarmPop" role="dialog" aria-label="设置提醒">
      <h4>设置提醒</h4>
      <div class="grid2" id="picks"></div>
      <label class="f">日期和时间<input type="datetime-local" class="field" id="dt"></label>
      <div class="f" style="display:flex;flex-direction:column;gap:6px"><span class="sub">重复</span>
        <div class="seg" id="repeat">
          <button data-v="none">不重复</button><button data-v="daily">每天</button><button data-v="weekdays">工作日</button><button data-v="weekly">每周</button><button data-v="monthly">每月</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px"><span class="sub">提醒方式</span>
        <label class="rad"><input type="radio" name="mode" value="glow">只让边缘发光</label>
        <label class="rad"><input type="radio" name="mode" value="notify">发光 + Windows 通知</label>
        <label class="rad"><input type="radio" name="mode" value="loud">发光 + 通知 + 提示音（一直显示）</label>
      </div>
      <div class="row"><button class="btn" id="alarmRemove">移除提醒</button><button class="btn" id="alarmCancel">取消</button><button class="btn primary" id="alarmSave">保存</button></div>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <div id="imgLayer" aria-hidden="true">
      <div id="imgBox" title="拖动摆放位置 · 拖角缩放（Shift 自由拉伸）· 双击看大图">
        <span class="ih" data-dir="nw"></span><span class="ih" data-dir="n"></span><span class="ih" data-dir="ne"></span>
        <span class="ih" data-dir="e"></span><span class="ih" data-dir="se"></span><span class="ih" data-dir="s"></span>
        <span class="ih" data-dir="sw"></span><span class="ih" data-dir="w"></span>
        <span id="imgSize"></span>
      </div>
    </div>
    <div id="imgBar" role="toolbar" aria-label="图片">
      <button data-a="inline" title="嵌入文字中：随文字排列">嵌入文字</button>
      <button data-a="free" title="自由摆放：拖到便签里任意位置">自由摆放</button>
      <span class="bsep"></span>
      <button class="inl" data-align="left" title="靠左" aria-label="靠左"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="9" height="8" rx="1"/><path d="M3 18h18"/></svg></button>
      <button class="inl" data-align="center" title="居中" aria-label="居中"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7.5" y="6" width="9" height="8" rx="1"/><path d="M3 18h18"/></svg></button>
      <button class="inl" data-align="right" title="靠右" aria-label="靠右"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="12" y="6" width="9" height="8" rx="1"/><path d="M3 18h18"/></svg></button>
      <button class="inl" data-align="wrap-left" title="文字环绕（图在左）" aria-label="文字环绕，图在左"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="8" height="8" rx="1"/><path d="M14 6h7M14 10h7M3 17h18M3 21h12"/></svg></button>
      <button class="inl" data-align="wrap-right" title="文字环绕（图在右）" aria-label="文字环绕，图在右"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="13" y="5" width="8" height="8" rx="1"/><path d="M3 6h7M3 10h7M3 17h18M3 21h12"/></svg></button>
      <button class="frl" data-a="front" title="置于顶层">置顶</button>
      <span class="bsep"></span>
      <button data-a="natural" title="原始大小">1:1</button>
      <button data-a="fit" title="适应便签宽度">适宽</button>
      <button data-a="del" title="删除图片 (Del)" aria-label="删除图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>
  </section>

  <div id="remindCard" class="hit" role="alert">
    <div class="rc-h"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 2M5 4l3 2M19 4l-3 2"/></svg><span class="rc-time"></span><span style="flex:1"></span><button class="ib" id="rcClose" aria-label="关闭" style="width:26px;height:26px">✕</button></div>
    <div class="rc-t"></div>
    <div class="rc-b"></div>
    <div class="rc-a"><button class="btn" id="rcSnooze">10 分钟后</button><button class="btn" id="rcOpen">打开</button><button class="btn primary" id="rcDone">完成</button></div>
  </div>
  <div id="toast" class="hit"><span></span><button>撤销</button></div>
  <div id="hint" class="hit">便签都藏在这里。<br>鼠标移到这条细线上就会展开。</div>
  <div id="flash"></div>
  <div id="menu" class="menu hit" style="display:none"></div>

  <script src="common.js"></script>
  <script src="edge.js"></script>
  <script src="imgedit.js"></script>
</body>
</html>

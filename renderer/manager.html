<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'">
<title>全部便签</title>
<link rel="stylesheet" href="common.css">
<style>
body { background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
header { padding: 16px 24px 10px; display: flex; flex-direction: column; gap: 12px; }
.tabs { display: flex; gap: 4px; }
.tabs button[role=tab] { height: 34px; padding: 0 14px; border: none; background: transparent; border-radius: 4px; font-size: 14px; position: relative; }
.tabs button[role=tab]:hover { background: var(--hover); }
.tabs button[role=tab].on { font-weight: 600; }
.tabs button[role=tab].on::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: 0; height: 3px; border-radius: 2px; background: var(--accent); }
.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.search { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 8px; }
.search .field { flex: 1; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chipb { height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--input-border); background: var(--input); font-size: 12px; }
.chipb:hover { background: var(--hover); }
.chipb.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.cdot { width: 20px; height: 20px; border-radius: 10px; border: none; padding: 0; }
.cdot.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
main { flex: 1; overflow-y: auto; padding: 6px 24px 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.card {
  border-radius: 6px; padding: 12px 14px; min-height: 140px; display: flex; flex-direction: column; gap: 6px;
  background: rgb(var(--nc)); color: var(--note-text); box-shadow: 0 1px 3px rgba(0,0,0,.14); position: relative; border: 2px solid transparent;
  text-align: left; font-size: 13px;
}
.card:hover { border-color: rgb(var(--tc)); }
.card:focus-visible { outline: 2px solid var(--accent); }
@media (prefers-color-scheme: dark) { .card::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 2px; background: rgb(var(--tc)); } }
.card b { font-size: 14px; }
.card p { margin: 0; font-size: 12px; line-height: 1.6; opacity: .85; white-space: pre-line; max-height: 96px; overflow: hidden; }
.card img { width: 100%; height: 70px; object-fit: cover; border-radius: 4px; }
.meta { margin-top: auto; font-size: 11px; opacity: .75; display: flex; gap: 8px; flex-wrap: wrap; }
.meta .al { color: #c4370f; font-weight: 600; opacity: 1; }
@media (prefers-color-scheme: dark) { .meta .al { color: #ffb19c; } }
mark { background: rgba(255, 196, 0, .55); color: inherit; border-radius: 2px; }
.row { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 8px 16px; border-radius: 6px; background: var(--card); border: 1px solid var(--card-border); margin-bottom: 8px; }
.row .sw { width: 6px; height: 36px; border-radius: 3px; flex-shrink: 0; }
.row .t { font-size: 14px; font-weight: 600; }
.row .s { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.row .grow { flex: 1; min-width: 0; }
.empty { text-align: center; color: var(--text-2); padding: 80px 0; font-size: 14px; }
.count { color: var(--text-2); font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="tabs" role="tablist">
    <button id="tNotes" class="on" role="tab">便签</button>
    <button id="tArchive" role="tab">归档</button>
    <span style="flex:1"></span>
    <button id="exportAll" class="btn">导出为 Markdown</button>
    <button id="newNote" class="btn primary">＋ 新建</button>
  </div>
  <div class="bar" id="filters">
    <label class="search"><input id="q" class="field" placeholder="搜索标题和内容" aria-label="搜索"></label>
    <select id="sort" class="field" aria-label="排序" style="width:140px">
      <option value="order">边缘顺序</option>
      <option value="updated">最近修改</option>
      <option value="created">最近创建</option>
      <option value="remind">提醒时间</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main><div id="list"></div></main>
<script src="common.js"></script>
<script src="manager.js"></script>
</body>
</html>
